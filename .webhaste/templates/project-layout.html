<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <title>{{TITLE}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{META_DESCRIPTION}}" />

  <!-- Local CSS styles -->
  <link rel="stylesheet" href="/scripts/styles.css" />

  <!-- site search scripts — remove if not using -->
  <script src="/scripts/lunr.min.js"></script>
  <script src="/scripts/search.js"></script>

</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="site-title">{{SITE_NAME}}</div>

    {{NAV:header}}

    <!-- UI for search input/results -->
    <div class="cs-search-wrap">
      <input type="search" id="cs-search-input" placeholder="Search..." autocomplete="off">
      <div id="cs-search-results"></div>
    </div>
  </header>

  <main id="main">
    {{CONTENT}}
  </main>

  <footer class="site-footer">
    <p>&copy; {{YEAR}} {{SITE_NAME}} — Created by ________.</p>
  </footer>

</body>
</html>
